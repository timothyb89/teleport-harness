        - key: terraform_native_join_lb__tokens-native.yaml
          path: terraform_native_join_lb__tokens-native.yaml
    - name: bind-apply-on-startup-fa025427
      persistentVolumeClaim:
        claimName: bind-apply-on-startup-fa025427
    - name: cm-auth-entrypoint-sh-6d9e4fb6
      configMap:
        name: cm-auth-entrypoint-sh-6d9e4fb6
        items:
        - key: auth-entrypoint.sh
