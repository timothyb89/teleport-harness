- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-auth
  spec:
    restartPolicy: Always
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: secret-wildcard-cert
      secret:
        secretName: wildcard-cert
    - name: cm-auth-yaml-470aa137
      configMap:
        name: cm-auth-yaml-470aa137
        items:
        - key: auth.yaml
          path: auth.yaml
    - name: cm-bootstrap-480b084b
      configMap:
        name: cm-bootstrap-480b084b
        items:
        - key: bots.manifest
          path: bots.manifest
        - key: scoped_app_access__1-scoped-role.yaml
          path: scoped_app_access__1-scoped-role.yaml
        - key: scoped_app_access__2-scoped-bots.yaml
          path: scoped_app_access__2-scoped-bots.yaml
        - key: scoped_app_access__3-assignments.yaml
          path: scoped_app_access__3-assignments.yaml
        - key: scoped_app_access__4-scoped-tokens.yaml
          path: scoped_app_access__4-scoped-tokens.yaml
        - key: scoped_app_access__5-unscoped.yaml
          path: scoped_app_access__5-unscoped.yaml
    - name: bind-apply-on-startup-fa025427
      persistentVolumeClaim:
        claimName: bind-apply-on-startup-fa025427
    - name: cm-auth-entrypoint-sh-7301428d
      configMap:
        name: cm-auth-entrypoint-sh-7301428d
        items:
        - key: auth-entrypoint.sh
          path: auth-entrypoint.sh
          mode: 493
    - name: vol-auth-data
      persistentVolumeClaim:
        claimName: vol-auth-data
    containers:
    - name: auth
      image: registry.harness:5000/teleport-harness:test
      command:
      - /scripts/auth-entrypoint.sh
      env:
      - name: TELEPORT_UNSTABLE_SCOPES
        value: 'yes'
      - name: TELEPORT_UNSTABLE_AGENT_SCOPE_PIN
        value: 'yes'
      volumeMounts:
      - name: secret-wildcard-cert
        mountPath: /certs
        readOnly: true
      - name: cm-auth-yaml-470aa137
        mountPath: /etc/teleport/auth.yaml
        readOnly: true
        subPath: auth.yaml
      - name: cm-bootstrap-480b084b
        mountPath: /bootstrap
        readOnly: true
      - name: bind-apply-on-startup-fa025427
        mountPath: /apply-on-startup
      - name: cm-auth-entrypoint-sh-7301428d
        mountPath: /scripts/auth-entrypoint.sh
        readOnly: true
        subPath: auth-entrypoint.sh
      - name: vol-auth-data
        mountPath: /var/lib/teleport
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - curl -fsS http://localhost:3000/healthz && test -f /tmp/bootstrap-done
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 40
    dnsPolicy: None
    dnsConfig:
      nameservers: []
      searches:
      - th-zz1.svc.cluster.local
      - svc.cluster.local
      - cluster.local
      options:
      - name: ndots
        value: '5'
