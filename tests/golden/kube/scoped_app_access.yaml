plan:
  namespace: th-zz1
  order:
  - - zz1-auth
    - zz1-httpbin
    - zz1-httpbin-decoy
  - - zz1-app-agent
    - zz1-app-agent-unscoped
    - zz1-cfg-scoped-bare
    - zz1-cfg-scoped-proxy
    - zz1-cfg-unscoped-sqn
  - - zz1-appbot
    - zz1-appbot-notfound
    - zz1-appbot-unscoped
  - - zz1-probe
  pods:
    zz1-app-agent:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-httpbin
        condition: started
      unhealthy_after: 213
    zz1-app-agent-unscoped:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-httpbin-decoy
        condition: started
      unhealthy_after: 213
    zz1-appbot:
      needs:
      - pod: zz1-app-agent
        condition: ready
      - pod: zz1-auth
        condition: ready
    zz1-appbot-notfound:
      needs:
      - pod: zz1-app-agent-unscoped
        condition: ready
      - pod: zz1-auth
        condition: ready
    zz1-appbot-unscoped:
      needs:
      - pod: zz1-app-agent-unscoped
        condition: ready
      - pod: zz1-auth
        condition: ready
    zz1-auth:
      needs: []
      unhealthy_after: 213
    zz1-cfg-scoped-bare:
      needs:
      - pod: zz1-auth
        condition: ready
    zz1-cfg-scoped-proxy:
      needs:
      - pod: zz1-auth
        condition: ready
    zz1-cfg-unscoped-sqn:
      needs:
      - pod: zz1-auth
        condition: ready
    zz1-httpbin:
      needs: []
    zz1-httpbin-decoy:
      needs: []
    zz1-probe:
      needs:
      - pod: zz1-appbot
        condition: started
      - pod: zz1-appbot-unscoped
        condition: started
      unhealthy_after: 303
  dns:
    pod: harness-dns
    service: harness-dns
    aliases:
      zz1.lab.example.com: zz1-auth.th-zz1.svc.cluster.local
  services:
    app-agent:
      pod: zz1-app-agent
      container: app-agent
    app-agent-unscoped:
      pod: zz1-app-agent-unscoped
      container: app-agent-unscoped
    appbot:
      pod: zz1-appbot
      container: appbot
    appbot-notfound:
      pod: zz1-appbot-notfound
      container: appbot-notfound
    appbot-unscoped:
      pod: zz1-appbot-unscoped
      container: appbot-unscoped
    auth:
      pod: zz1-auth
      container: auth
    cfg-scoped-bare:
      pod: zz1-cfg-scoped-bare
      container: cfg-scoped-bare
    cfg-scoped-proxy:
      pod: zz1-cfg-scoped-proxy
      container: cfg-scoped-proxy
    cfg-unscoped-sqn:
      pod: zz1-cfg-unscoped-sqn
      container: cfg-unscoped-sqn
    httpbin:
      pod: zz1-httpbin
      container: httpbin
    httpbin-decoy:
      pod: zz1-httpbin-decoy
      container: httpbin-decoy
    probe:
      pod: zz1-probe
      container: probe
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts: []
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  local_images:
  - teleport-harness:test
