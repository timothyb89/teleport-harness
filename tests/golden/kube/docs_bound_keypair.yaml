plan:
  namespace: th-zz1
  order:
  - - zz1-auth
  - - zz1-agent-idbot
  - - zz1-workbench
  pods:
    zz1-agent-idbot:
      needs:
      - pod: zz1-auth
        condition: ready
      unhealthy_after: 128
    zz1-auth:
      needs: []
      unhealthy_after: 213
    zz1-workbench:
      needs:
      - pod: zz1-agent-idbot
        condition: ready
  dns:
    pod: harness-dns
    service: harness-dns
    aliases:
      zz1.lab.example.com: zz1-auth.th-zz1.svc.cluster.local
  services:
    agent-idbot:
      pod: zz1-agent-idbot
      container: agent-idbot
    auth:
      pod: zz1-auth
      container: auth
    workbench:
      pod: zz1-workbench
      container: workbench
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts:
  - image: registry.harness:5000/harness-artifact:zz1-art-docs-c54ece9e
    source: /fake/teleport/docs
    kind: dir
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  - source: agent/out
    pod: zz1-workbench
    container: workbench
    path: /out
  local_images:
  - teleport-harness:test
