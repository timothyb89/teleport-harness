    zz1-auth:
      needs: []
      unhealthy_after: 213
    zz1-wi-probe-fast:
      needs:
      - pod: zz1-wi-shaper-fast
        condition: started
    zz1-wi-probe-slow:
      needs:
      - pod: zz1-wi-shaper-slow
        condition: started
    zz1-wi-shaper-fast:
      needs:
      - pod: zz1-auth
        condition: ready
      unhealthy_after: 125
    zz1-wi-shaper-slow:
      needs:
      - pod: zz1-auth
        condition: ready
      unhealthy_after: 125
  dns:
    pod: harness-dns
    service: harness-dns
    aliases:
      zz1.lab.example.com: zz1-auth.th-zz1.svc.cluster.local
  services:
    auth:
      pod: zz1-auth
      container: auth
    wi-probe-fast:
      pod: zz1-wi-probe-fast
      container: wi-probe-fast
    wi-probe-slow:
      pod: zz1-wi-probe-slow
      container: wi-probe-slow
    wi-shaper-fast:
      pod: zz1-wi-shaper-fast
      container: wi-shaper-fast
    wi-shaper-slow:
      pod: zz1-wi-shaper-slow
      container: wi-shaper-slow
    wi-tbot-fast:
      pod: zz1-wi-shaper-fast
      container: wi-tbot-fast
    wi-tbot-slow:
      pod: zz1-wi-shaper-slow
