plan:
  namespace: th-zz1
  order:
  - - zz1-auth
    - zz1-cache-idp
    - zz1-oidc
  - - zz1-cache-probe
  pods:
    zz1-auth:
      needs: []
      unhealthy_after: 213
    zz1-cache-idp:
      needs: []
    zz1-cache-probe:
      needs:
      - pod: zz1-auth
        condition: ready
    zz1-oidc:
      needs: []
  dns:
    pod: harness-dns
    service: harness-dns
    aliases:
      cache-idp.lab.example.com: zz1-cache-idp.th-zz1.svc.cluster.local
      oidc.lab.example.com: zz1-oidc.th-zz1.svc.cluster.local
      zz1.lab.example.com: zz1-auth.th-zz1.svc.cluster.local
  services:
    auth:
      pod: zz1-auth
      container: auth
    cache-idp:
      pod: zz1-cache-idp
      container: cache-idp
    cache-probe:
      pod: zz1-cache-probe
      container: cache-probe
    oidc:
      pod: zz1-oidc
      container: oidc
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts: []
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  local_images:
  - teleport-harness-oidc:v4
  - teleport-harness:test
