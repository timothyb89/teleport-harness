- apiVersion: traefik.io/v1alpha1
  kind: IngressRouteTCP
  metadata:
    name: auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
  spec:
    entryPoints:
    - harness
    routes:
    - match: HostSNI(`zz1.lab.example.com`) || HostSNIRegexp(`^.+\.zz1\.lab\.example\.com$`)
      services:
      - name: ingress
        port: 8443
    tls:
      passthrough: true
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-auth
  spec:
    restartPolicy: Always
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: secret-wildcard-cert
      secret:
        secretName: wildcard-cert
    - name: cm-auth-yaml-470aa137
      configMap:
        name: cm-auth-yaml-470aa137
        items:
        - key: auth.yaml
          path: auth.yaml
    - name: cm-bootstrap-480b084b
      configMap:
        name: cm-bootstrap-480b084b
        items:
        - key: bots.manifest
          path: bots.manifest
        - key: bound_keypair_status__admin-token.yaml
          path: bound_keypair_status__admin-token.yaml
        - key: bound_keypair_status__role-bks-tester.yaml
          path: bound_keypair_status__role-bks-tester.yaml
        - key: bound_keypair_status__token.yaml
          path: bound_keypair_status__token.yaml
    - name: bind-apply-on-startup-fa025427
      persistentVolumeClaim:
        claimName: bind-apply-on-startup-fa025427
    - name: cm-auth-entrypoint-sh-7301428d
      configMap:
        name: cm-auth-entrypoint-sh-7301428d
        items:
        - key: auth-entrypoint.sh
          path: auth-entrypoint.sh
          mode: 493
    - name: vol-auth-data
      persistentVolumeClaim:
        claimName: vol-auth-data
    containers:
    - name: auth
      image: registry.harness:5000/teleport-harness:test
      command:
      - /scripts/auth-entrypoint.sh
      volumeMounts:
      - name: secret-wildcard-cert
        mountPath: /certs
        readOnly: true
      - name: cm-auth-yaml-470aa137
        mountPath: /etc/teleport/auth.yaml
        readOnly: true
        subPath: auth.yaml
      - name: cm-bootstrap-480b084b
        mountPath: /bootstrap
        readOnly: true
      - name: bind-apply-on-startup-fa025427
        mountPath: /apply-on-startup
      - name: cm-auth-entrypoint-sh-7301428d
        mountPath: /scripts/auth-entrypoint.sh
        readOnly: true
        subPath: auth-entrypoint.sh
      - name: vol-auth-data
        mountPath: /var/lib/teleport
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - curl -fsS http://localhost:3000/healthz && test -f /tmp/bootstrap-done
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 40
    hostAliases:
    - ip: 127.0.0.1
      hostnames:
      - zz1.lab.example.com
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-bks-idbot
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-bks-idbot
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: cm-bks-idbot-yaml-22fb04c0
      configMap:
        name: cm-bks-idbot-yaml-22fb04c0
        items:
        - key: bks-idbot.yaml
          path: bks-idbot.yaml
    - name: vol-bks-identity
      persistentVolumeClaim:
        claimName: vol-bks-identity
    containers:
    - name: bks-idbot
      image: registry.harness:5000/teleport-harness:test
      args:
      - tbot
      - start
      - -c
      - /etc/tbot.yaml
      - --token=harness-bks-admin
      - --join-method=token
      volumeMounts:
      - name: cm-bks-idbot-yaml-22fb04c0
        mountPath: /etc/tbot.yaml
        readOnly: true
        subPath: bks-idbot.yaml
      - name: vol-bks-identity
        mountPath: /idents
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - test -s /idents/identity
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 40
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-bksbot
    namespace: th-zz1
