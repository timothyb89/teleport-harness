    containers:
    - name: bksbot
      image: registry.harness:5000/teleport-harness:test
      args:
      - tbot
      - start
      - -c
      - /etc/tbot.yaml
      volumeMounts:
      - name: cm-bks-tbot-yaml-0ecb48a7
        mountPath: /etc/tbot.yaml
        readOnly: true
        subPath: bks-tbot.yaml
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-bkstatus
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-bkstatus
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: cm-bound-keypair-status-36d9f4ce
      configMap:
        name: cm-bound-keypair-status-36d9f4ce
        items:
        - key: mutate.sh
          path: mutate.sh
          mode: 493
    - name: cm-token-spec-only-yaml-d41c23cc
      configMap:
        name: cm-token-spec-only-yaml-d41c23cc
        items:
        - key: token-spec-only.yaml
          path: token-spec-only.yaml
    - name: cm-token-tampered-yaml-91d66afe
      configMap:
        name: cm-token-tampered-yaml-91d66afe
        items:
        - key: token-tampered.yaml
          path: token-tampered.yaml
    - name: cm-spare-marker-a-yaml-afc88d3c
      configMap:
        name: cm-spare-marker-a-yaml-afc88d3c
        items:
        - key: spare-marker-a.yaml
          path: spare-marker-a.yaml
    - name: cm-spare-marker-b-yaml-3d1387f6
      configMap:
        name: cm-spare-marker-b-yaml-3d1387f6
        items:
        - key: spare-marker-b.yaml
          path: spare-marker-b.yaml
    - name: vol-bks-identity
      persistentVolumeClaim:
        claimName: vol-bks-identity
    containers:
    - name: bkstatus
      image: registry.harness:5000/teleport-harness:test
      command:
      - sh
      - /scripts/mutate.sh
      env:
      - name: AUTH_ADDR
        value: auth:3025
      - name: IDENTITY
        value: /id/identity
      - name: TOKEN_NAME
        value: bks-token
      - name: SPARE_TOKEN
        value: bks-recreate
      - name: NEW_RECOVERY_LIMIT
        value: '7'
      - name: TAMPERED_RECOVERY_LIMIT
        value: '9'
      - name: MARKER_B_RECOVERY_LIMIT
        value: '5'
      - name: MARKER_A
        value: harness-bks-marker-a
      - name: MARKER_B
        value: harness-bks-marker-b
      volumeMounts:
      - name: cm-bound-keypair-status-36d9f4ce
        mountPath: /scripts
        readOnly: true
      - name: cm-token-spec-only-yaml-d41c23cc
        mountPath: /work/token-spec-only.yaml
        readOnly: true
        subPath: token-spec-only.yaml
      - name: cm-token-tampered-yaml-91d66afe
        mountPath: /work/token-tampered.yaml
        readOnly: true
        subPath: token-tampered.yaml
      - name: cm-spare-marker-a-yaml-afc88d3c
        mountPath: /work/spare-marker-a.yaml
        readOnly: true
        subPath: spare-marker-a.yaml
      - name: cm-spare-marker-b-yaml-3d1387f6
        mountPath: /work/spare-marker-b.yaml
        readOnly: true
        subPath: spare-marker-b.yaml
      - name: vol-bks-identity
        mountPath: /id
        readOnly: true
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - test -f /tmp/mutate-done
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 60
plan:
  namespace: th-zz1
  order:
  - - zz1-auth
  - - zz1-bks-idbot
    - zz1-bksbot
  - - zz1-bkstatus
  pods:
    zz1-auth:
      needs: []
      host_aliases: {}
    zz1-bks-idbot:
      needs:
      - pod: zz1-auth
        condition: ready
      host_aliases:
        zz1.lab.example.com: zz1-auth
    zz1-bksbot:
      needs:
      - pod: zz1-auth
        condition: ready
      host_aliases:
        zz1.lab.example.com: zz1-auth
    zz1-bkstatus:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-bks-idbot
        condition: ready
      - pod: zz1-bksbot
        condition: started
      host_aliases:
        zz1.lab.example.com: zz1-auth
  services:
    auth:
      pod: zz1-auth
      container: auth
    bks-idbot:
      pod: zz1-bks-idbot
      container: bks-idbot
    bksbot:
      pod: zz1-bksbot
      container: bksbot
    bkstatus:
      pod: zz1-bkstatus
      container: bkstatus
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts: []
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  local_images:
  - teleport-harness:test
