plan:
  namespace: th-zz1
  order:
  - - zz1-oidc
  - - zz1-auth
  - - zz1-tf-idbot
  - - zz1-tf-oidc
  - - zz1-tf-agent-badorg
    - zz1-tf-agent-ok
  pods:
    zz1-auth:
      needs:
      - pod: zz1-oidc
        condition: started
      host_aliases:
        oidc.lab.example.com: zz1-oidc
    zz1-oidc:
      needs: []
      host_aliases: {}
    zz1-tf-agent-badorg:
      needs:
      - pod: zz1-auth
        condition: started
      - pod: zz1-oidc
        condition: started
      - pod: zz1-tf-oidc
        condition: ready
      host_aliases:
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
    zz1-tf-agent-ok:
      needs:
      - pod: zz1-auth
        condition: started
      - pod: zz1-oidc
        condition: started
      - pod: zz1-tf-oidc
        condition: ready
      host_aliases:
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
    zz1-tf-idbot:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-oidc
        condition: started
      host_aliases:
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
    zz1-tf-oidc:
      needs:
      - pod: zz1-auth
        condition: started
      - pod: zz1-oidc
        condition: started
      - pod: zz1-tf-idbot
        condition: ready
      host_aliases:
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
  services:
    auth:
      pod: zz1-auth
      container: auth
    oidc:
      pod: zz1-oidc
      container: oidc
    tf-agent-badorg:
      pod: zz1-tf-agent-badorg
      container: tf-agent-badorg
    tf-agent-ok:
      pod: zz1-tf-agent-ok
      container: tf-agent-ok
    tf-idbot:
      pod: zz1-tf-idbot
      container: tf-idbot
    tf-oidc:
      pod: zz1-tf-oidc
      container: tf-oidc
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts:
  - image: registry.harness:5000/harness-artifact:zz1-art-tf-plugins-f61551dd
    source: $STATE/tf-plugins
    kind: dir
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  local_images:
  - teleport-harness-oidc:v4
  - teleport-harness:test
