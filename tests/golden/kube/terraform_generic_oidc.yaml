- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-tf-oidc
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-tf-oidc
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: art-tf-plugins-f61551dd
      emptyDir: {}
    - name: cm-tf-entrypoint-sh-16adf958
      configMap:
        name: cm-tf-entrypoint-sh-16adf958
        items:
        - key: tf-entrypoint.sh
          path: tf-entrypoint.sh
    - name: cm-tf-e8f44c4a
      configMap:
        name: cm-tf-e8f44c4a
        items:
        - key: main.tf
          path: main.tf
        - key: variables.tf
          path: variables.tf
    - name: vol-tf-identity
      persistentVolumeClaim:
        claimName: vol-tf-identity
    initContainers:
    - name: artifact-0
      image: registry.harness:5000/harness-artifact:zz1-art-tf-plugins-f61551dd
      command:
      - sh
      - -c
      - cp -R /artifact/. /dst/
      volumeMounts:
      - name: art-tf-plugins-f61551dd
        mountPath: /dst
    containers:
    - name: tf-oidc
      image: hashicorp/terraform:1.9
      command:
      - sh
      - /scripts/tf-entrypoint.sh
      env:
      - name: TF_BIN
        value: terraform
      - name: TF_TELEPORT_ADDR
        value: zz1-auth:3025
      - name: TF_TELEPORT_IDENTITY_FILE_PATH
        value: /id/identity
      - name: TF_VAR_issuer
        value: https://oidc.lab.example.com:8443
      - name: TF_VAR_audience
        value: zz1.lab.example.com/generic-oidc
      volumeMounts:
      - name: art-tf-plugins-f61551dd
        mountPath: /plugins
        readOnly: true
      - name: cm-tf-entrypoint-sh-16adf958
        mountPath: /scripts/tf-entrypoint.sh
        readOnly: true
        subPath: tf-entrypoint.sh
      - name: cm-tf-e8f44c4a
        mountPath: /work
        readOnly: true
      - name: vol-tf-identity
        mountPath: /id
        readOnly: true
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - test -f /tmp/tf-apply-done
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 40
