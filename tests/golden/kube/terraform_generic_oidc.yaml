    - name: vol-tf-identity
      persistentVolumeClaim:
        claimName: vol-tf-identity
    containers:
    - name: tf-idbot
      image: registry.harness:5000/teleport-harness:test
      args:
      - tbot
      - start
      - -c
      - /etc/tbot.yaml
      - --token=harness-tf-admin-secret
      - --join-method=token
      volumeMounts:
      - name: cm-tf-idbot-yaml-dc349ae7
        mountPath: /etc/tbot.yaml
        readOnly: true
        subPath: tf-idbot.yaml
      - name: vol-tf-identity
        mountPath: /idents
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - test -s /idents/identity
        periodSeconds: 3
        timeoutSeconds: 3
