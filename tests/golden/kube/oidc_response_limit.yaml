plan:
  namespace: th-zz1
  order:
  - - zz1-bigdisco
  - - zz1-bigjwks
  - - zz1-oidc
  - - zz1-auth
  - - zz1-limit-bigdisco
    - zz1-limit-bigjwks
    - zz1-limit-ok
  pods:
    zz1-auth:
      needs:
      - pod: zz1-bigdisco
        condition: started
      - pod: zz1-bigjwks
        condition: started
      - pod: zz1-oidc
        condition: started
      host_aliases:
        bigdisco.lab.example.com: zz1-bigdisco
        bigjwks.lab.example.com: zz1-bigjwks
        oidc.lab.example.com: zz1-oidc
    zz1-bigdisco:
      needs: []
      host_aliases: {}
    zz1-bigjwks:
      needs:
      - pod: zz1-bigdisco
        condition: started
      host_aliases:
        bigdisco.lab.example.com: zz1-bigdisco
    zz1-limit-bigdisco:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-bigdisco
        condition: started
      - pod: zz1-bigjwks
        condition: started
      - pod: zz1-oidc
        condition: started
      host_aliases:
        bigdisco.lab.example.com: zz1-bigdisco
        bigjwks.lab.example.com: zz1-bigjwks
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
