  namespace: th-zz1
  order:
  - - zz1-oidc
  - - zz1-auth
  - - zz1-su-idbot
    - zz1-su-kube-single-first
    - zz1-su-kube-single-second
    - zz1-su-kube-unlimited-first
    - zz1-su-kube-unlimited-second
    - zz1-su-oidc-single-first
    - zz1-su-oidc-single-second
    - zz1-su-oidc-unlimited-first
    - zz1-su-oidc-unlimited-second
    - zz1-su-token-single-first
    - zz1-su-token-single-second
    - zz1-su-token-unlimited-first
    - zz1-su-token-unlimited-second
  - - zz1-su-actor
  pods:
    zz1-auth:
      needs:
      - pod: zz1-oidc
        condition: started
      host_aliases:
        oidc.lab.example.com: zz1-oidc
