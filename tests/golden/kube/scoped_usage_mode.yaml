- apiVersion: traefik.io/v1alpha1
  kind: IngressRouteTCP
  metadata:
    name: auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
  spec:
    entryPoints:
    - harness
    routes:
    - match: HostSNI(`zz1.lab.example.com`) || HostSNI(`7a7a312e6c61622e6578616d706c652e636f6d.teleport.cluster.local`)
        || HostSNIRegexp(`^.+\.zz1\.lab\.example\.com$`)
      services:
      - name: ingress
        port: 8443
    tls:
      passthrough: true
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-oidc
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-oidc
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: secret-wildcard-cert
      secret:
        secretName: wildcard-cert
    - name: vol-oidc-data
      persistentVolumeClaim:
        claimName: vol-oidc-data
    containers:
    - name: oidc
      image: registry.harness:5000/teleport-harness-oidc:v4
      args:
      - -issuer=https://oidc.lab.example.com:8443
      - -addr=:8443
      - -audience=zz1.lab.example.com/generic-oidc
      - -cluster-name=zz1.lab.example.com
      - -tls-cert=/certs/wildcard.crt
      - -tls-key=/certs/wildcard.key
      volumeMounts:
      - name: secret-wildcard-cert
        mountPath: /certs
        readOnly: true
      - name: vol-oidc-data
        mountPath: /data
        readOnly: false
    hostAliases:
    - ip: 127.0.0.1
      hostnames:
      - oidc.lab.example.com
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-auth
  spec:
    restartPolicy: Always
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: secret-wildcard-cert
      secret:
        secretName: wildcard-cert
    - name: cm-auth-yaml-470aa137
      configMap:
        name: cm-auth-yaml-470aa137
        items:
        - key: auth.yaml
          path: auth.yaml
    - name: cm-bootstrap-480b084b
      configMap:
        name: cm-bootstrap-480b084b
        items:
        - key: bots.manifest
          path: bots.manifest
        - key: hooks_scoped_usage_mode__jwks-tokens.sh
          path: hooks/scoped_usage_mode__jwks-tokens.sh
        - key: scoped_usage_mode__admin-token.yaml
          path: scoped_usage_mode__admin-token.yaml
        - key: scoped_usage_mode__role-su-token-admin.yaml
          path: scoped_usage_mode__role-su-token-admin.yaml
        - key: scoped_usage_mode__token-method-tokens.yaml
          path: scoped_usage_mode__token-method-tokens.yaml
    - name: bind-apply-on-startup-fa025427
      persistentVolumeClaim:
        claimName: bind-apply-on-startup-fa025427
    - name: cm-auth-entrypoint-sh-7301428d
      configMap:
        name: cm-auth-entrypoint-sh-7301428d
        items:
        - key: auth-entrypoint.sh
          path: auth-entrypoint.sh
          mode: 493
    - name: vol-auth-data
      persistentVolumeClaim:
        claimName: vol-auth-data
    containers:
    - name: auth
      image: registry.harness:5000/teleport-harness:test
      command:
      - /scripts/auth-entrypoint.sh
      env:
      - name: TELEPORT_UNSTABLE_SCOPES
        value: 'yes'
      volumeMounts:
      - name: secret-wildcard-cert
        mountPath: /certs
        readOnly: true
      - name: cm-auth-yaml-470aa137
        mountPath: /etc/teleport/auth.yaml
        readOnly: true
        subPath: auth.yaml
      - name: cm-bootstrap-480b084b
        mountPath: /bootstrap
        readOnly: true
      - name: bind-apply-on-startup-fa025427
        mountPath: /apply-on-startup
      - name: cm-auth-entrypoint-sh-7301428d
        mountPath: /scripts/auth-entrypoint.sh
        readOnly: true
        subPath: auth-entrypoint.sh
      - name: vol-auth-data
        mountPath: /var/lib/teleport
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - curl -fsS http://localhost:3000/healthz && test -f /tmp/bootstrap-done
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 40
    hostAliases:
    - ip: 127.0.0.1
      hostnames:
      - zz1.lab.example.com
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-su-idbot
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-su-idbot
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: cm-su-idbot-yaml-25e17887
      configMap:
        name: cm-su-idbot-yaml-25e17887
        items:
        - key: su-idbot.yaml
          path: su-idbot.yaml
    - name: vol-su-identity
      persistentVolumeClaim:
        claimName: vol-su-identity
    containers:
    - name: su-idbot
      image: registry.harness:5000/teleport-harness:test
      args:
      - tbot
      - start
      - -c
      - /etc/tbot.yaml
      - --token=harness-su-admin
      - --join-method=token
      volumeMounts:
      - name: cm-su-idbot-yaml-25e17887
        mountPath: /etc/tbot.yaml
