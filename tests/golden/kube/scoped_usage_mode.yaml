      needs: []
      host_aliases: {}
    zz1-su-actor:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-oidc
        condition: started
      - pod: zz1-su-idbot
        condition: ready
      host_aliases:
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
    zz1-su-idbot:
      needs:
      - pod: zz1-auth
        condition: ready
