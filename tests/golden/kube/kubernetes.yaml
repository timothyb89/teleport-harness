plan:
  namespace: th-zz1
  order:
  - - zz1-oidc
  - - zz1-auth
  - - zz1-kube-jwks
    - zz1-kube-oidc
  pods:
    zz1-auth:
      needs:
      - pod: zz1-oidc
        condition: started
      host_aliases:
        oidc.lab.example.com: zz1-oidc
    zz1-kube-jwks:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-oidc
        condition: started
      host_aliases:
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
    zz1-kube-oidc:
      needs:
      - pod: zz1-auth
        condition: ready
      - pod: zz1-oidc
        condition: started
      host_aliases:
        oidc.lab.example.com: zz1-oidc
        zz1.lab.example.com: zz1-auth
    zz1-oidc:
      needs: []
      host_aliases: {}
  services:
    auth:
      pod: zz1-auth
      container: auth
    kube-jwks:
      pod: zz1-kube-jwks
      container: kube-jwks
    kube-oidc:
      pod: zz1-kube-oidc
      container: kube-oidc
    oidc:
      pod: zz1-oidc
      container: oidc
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts: []
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  local_images:
  - teleport-harness-oidc:v4
  - teleport-harness:test
