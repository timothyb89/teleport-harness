- apiVersion: traefik.io/v1alpha1
  kind: IngressRouteTCP
  metadata:
    name: auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
  spec:
    entryPoints:
    - harness
    routes:
    - match: HostSNI(`zz1.lab.example.com`) || HostSNIRegexp(`^.+\.zz1\.lab\.example\.com$`)
      services:
      - name: ingress
        port: 8443
    tls:
      passthrough: true
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-oidc
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-oidc
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: secret-wildcard-cert
      secret:
        secretName: wildcard-cert
    - name: vol-oidc-data
      persistentVolumeClaim:
        claimName: vol-oidc-data
    containers:
    - name: oidc
      image: registry.harness:5000/teleport-harness-oidc:v4
      args:
      - -issuer=https://oidc.lab.example.com:8443
      - -addr=:8443
      - -audience=zz1.lab.example.com/generic-oidc
      - -cluster-name=zz1.lab.example.com
      - -tls-cert=/certs/wildcard.crt
      - -tls-key=/certs/wildcard.key
      volumeMounts:
      - name: secret-wildcard-cert
        mountPath: /certs
        readOnly: true
      - name: vol-oidc-data
        mountPath: /data
        readOnly: false
    hostAliases:
    - ip: 127.0.0.1
      hostnames:
      - oidc.lab.example.com
- apiVersion: v1
