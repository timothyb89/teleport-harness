- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-auth
  spec:
    restartPolicy: Always
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: secret-wildcard-cert
      secret:
        secretName: wildcard-cert
    - name: cm-auth-yaml-470aa137
      configMap:
        name: cm-auth-yaml-470aa137
        items:
        - key: auth.yaml
          path: auth.yaml
    - name: cm-bootstrap-480b084b
      configMap:
        name: cm-bootstrap-480b084b
        items:
        - key: bots.manifest
          path: bots.manifest
        - key: terraform-runner__token.yaml
          path: terraform-runner__token.yaml
    - name: bind-apply-on-startup-fa025427
      persistentVolumeClaim:
        claimName: bind-apply-on-startup-fa025427
    - name: cm-auth-entrypoint-sh-7301428d
      configMap:
        name: cm-auth-entrypoint-sh-7301428d
        items:
        - key: auth-entrypoint.sh
          path: auth-entrypoint.sh
          mode: 493
    - name: vol-auth-data
      persistentVolumeClaim:
        claimName: vol-auth-data
    containers:
    - name: auth
      image: registry.harness:5000/teleport-harness:test
      command:
      - /scripts/auth-entrypoint.sh
      volumeMounts:
      - name: secret-wildcard-cert
        mountPath: /certs
        readOnly: true
      - name: cm-auth-yaml-470aa137
        mountPath: /etc/teleport/auth.yaml
        readOnly: true
        subPath: auth.yaml
      - name: cm-bootstrap-480b084b
        mountPath: /bootstrap
        readOnly: true
      - name: bind-apply-on-startup-fa025427
        mountPath: /apply-on-startup
      - name: cm-auth-entrypoint-sh-7301428d
        mountPath: /scripts/auth-entrypoint.sh
        readOnly: true
        subPath: auth-entrypoint.sh
      - name: vol-auth-data
        mountPath: /var/lib/teleport
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - curl -fsS http://localhost:3000/healthz && test -f /tmp/bootstrap-done
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 40
    dnsPolicy: None
    dnsConfig:
      nameservers: []
      searches:
      - th-zz1.svc.cluster.local
      - svc.cluster.local
      - cluster.local
      options:
      - name: ndots
        value: '5'
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-tf-idbot
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-tf-idbot
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: cm-tf-idbot-yaml-dc349ae7
      configMap:
        name: cm-tf-idbot-yaml-dc349ae7
        items:
        - key: tf-idbot.yaml
          path: tf-idbot.yaml
    - name: vol-tf-identity
      persistentVolumeClaim:
        claimName: vol-tf-identity
    containers:
    - name: tf-idbot
      image: registry.harness:5000/teleport-harness:test
      args:
      - tbot
      - start
      - -c
      - /etc/tbot.yaml
      - --token=harness-tf-admin-secret
      - --join-method=token
      volumeMounts:
      - name: cm-tf-idbot-yaml-dc349ae7
        mountPath: /etc/tbot.yaml
        readOnly: true
        subPath: tf-idbot.yaml
      - name: vol-tf-identity
        mountPath: /idents
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - test -s /idents/identity
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 40
    dnsPolicy: None
    dnsConfig:
      nameservers: []
      searches:
      - th-zz1.svc.cluster.local
      - svc.cluster.local
      - cluster.local
      options:
      - name: ndots
        value: '5'
- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-tf-bot
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-tf-bot
  spec:
    restartPolicy: Never
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: art-tf-plugins-f61551dd
      emptyDir: {}
    - name: cm-tf-entrypoint-sh-16adf958
      configMap:
        name: cm-tf-entrypoint-sh-16adf958
        items:
        - key: tf-entrypoint.sh
          path: tf-entrypoint.sh
    - name: cm-tf-8d08ddf2
      configMap:
        name: cm-tf-8d08ddf2
        items:
        - key: main.tf
          path: main.tf
    - name: vol-tf-identity
      persistentVolumeClaim:
        claimName: vol-tf-identity
    initContainers:
    - name: artifact-0
      image: registry.harness:5000/harness-artifact:zz1-art-tf-plugins-f61551dd
      command:
      - sh
      - -c
      - cp -R /artifact/. /dst/
      volumeMounts:
      - name: art-tf-plugins-f61551dd
        mountPath: /dst
    containers:
    - name: tf-bot
      image: hashicorp/terraform:1.9
      command:
      - sh
      - /scripts/tf-entrypoint.sh
      env:
      - name: TF_BIN
        value: terraform
      - name: TF_TELEPORT_ADDR
        value: zz1-auth:3025
      - name: TF_TELEPORT_IDENTITY_FILE_PATH
        value: /id/identity
      volumeMounts:
      - name: art-tf-plugins-f61551dd
        mountPath: /plugins
        readOnly: true
      - name: cm-tf-entrypoint-sh-16adf958
        mountPath: /scripts/tf-entrypoint.sh
        readOnly: true
        subPath: tf-entrypoint.sh
      - name: cm-tf-8d08ddf2
        mountPath: /work
        readOnly: true
      - name: vol-tf-identity
        mountPath: /id
        readOnly: true
    dnsPolicy: None
    dnsConfig:
      nameservers: []
      searches:
      - th-zz1.svc.cluster.local
      - svc.cluster.local
      - cluster.local
      options:
      - name: ndots
        value: '5'
plan:
  namespace: th-zz1
  order:
  - - zz1-auth
  - - zz1-tf-idbot
  - - zz1-tf-bot
  pods:
    zz1-auth:
      needs: []
      unhealthy_after: 213
    zz1-tf-bot:
      needs:
      - pod: zz1-tf-idbot
        condition: ready
    zz1-tf-idbot:
      needs:
      - pod: zz1-auth
        condition: ready
      unhealthy_after: 128
  dns:
    pod: harness-dns
    service: harness-dns
    aliases:
      zz1.lab.example.com: zz1-auth.th-zz1.svc.cluster.local
  services:
    auth:
      pod: zz1-auth
      container: auth
    tf-bot:
      pod: zz1-tf-bot
      container: tf-bot
    tf-idbot:
      pod: zz1-tf-idbot
      container: tf-idbot
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts:
  - image: registry.harness:5000/harness-artifact:zz1-art-tf-plugins-f61551dd
    source: $STATE/tf-plugins
    kind: dir
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  local_images:
  - teleport-harness:test
