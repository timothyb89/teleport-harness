- apiVersion: v1
  kind: Pod
  metadata:
    name: zz1-auth
    namespace: th-zz1
    labels:
      app.kubernetes.io/part-of: teleport-harness
      harness.teleport/cluster-id: zz1
      harness.teleport/pod: zz1-auth
  spec:
    restartPolicy: Always
    enableServiceLinks: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 10
    volumes:
    - name: secret-wildcard-cert
      secret:
        secretName: wildcard-cert
    - name: cm-auth-yaml-470aa137
      configMap:
        name: cm-auth-yaml-470aa137
        items:
        - key: auth.yaml
          path: auth.yaml
    - name: cm-bootstrap-480b084b
      configMap:
        name: cm-bootstrap-480b084b
        items:
        - key: bots.manifest
          path: bots.manifest
        - key: bound_keypair__role-tbot-tester.yaml
          path: bound_keypair__role-tbot-tester.yaml
        - key: bound_keypair__token.yaml
          path: bound_keypair__token.yaml
    - name: bind-apply-on-startup-fa025427
      persistentVolumeClaim:
        claimName: bind-apply-on-startup-fa025427
    - name: cm-auth-entrypoint-sh-7301428d
      configMap:
        name: cm-auth-entrypoint-sh-7301428d
        items:
        - key: auth-entrypoint.sh
          path: auth-entrypoint.sh
          mode: 493
    - name: vol-auth-data
      persistentVolumeClaim:
        claimName: vol-auth-data
    containers:
    - name: auth
      image: registry.harness:5000/teleport-harness:test
      command:
      - /scripts/auth-entrypoint.sh
      volumeMounts:
      - name: secret-wildcard-cert
        mountPath: /certs
        readOnly: true
      - name: cm-auth-yaml-470aa137
        mountPath: /etc/teleport/auth.yaml
        readOnly: true
        subPath: auth.yaml
      - name: cm-bootstrap-480b084b
        mountPath: /bootstrap
        readOnly: true
      - name: bind-apply-on-startup-fa025427
        mountPath: /apply-on-startup
      - name: cm-auth-entrypoint-sh-7301428d
        mountPath: /scripts/auth-entrypoint.sh
        readOnly: true
        subPath: auth-entrypoint.sh
      - name: vol-auth-data
        mountPath: /var/lib/teleport
        readOnly: false
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - curl -fsS http://localhost:3000/healthz && test -f /tmp/bootstrap-done
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 40
    hostAliases:
    - ip: 127.0.0.1
      hostnames:
      - zz1.lab.example.com
