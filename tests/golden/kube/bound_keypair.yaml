plan:
  namespace: th-zz1
  order:
  - - zz1-auth
  - - zz1-bkbot
    - zz1-bkbot-deny
  pods:
    zz1-auth:
      needs: []
      host_aliases: {}
    zz1-bkbot:
      needs:
      - pod: zz1-auth
        condition: ready
      host_aliases:
        zz1.lab.example.com: zz1-auth
    zz1-bkbot-deny:
      needs:
      - pod: zz1-auth
        condition: ready
      host_aliases:
        zz1.lab.example.com: zz1-auth
  services:
    auth:
      pod: zz1-auth
      container: auth
    bkbot:
      pod: zz1-bkbot
      container: bkbot
    bkbot-deny:
      pod: zz1-bkbot-deny
      container: bkbot-deny
  secrets:
  - name: wildcard-cert
    from: harness-system
  artifacts: []
  pullbacks:
  - source: apply-on-startup
    pod: zz1-auth
    container: auth
    path: /apply-on-startup
  local_images:
  - teleport-harness:test
