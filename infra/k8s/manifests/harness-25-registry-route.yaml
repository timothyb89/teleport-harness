# Remote pushes: TLS terminated here with the wildcard cert, so crane talks to a real,
# publicly trusted https registry through the same forwarder as everything else.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: registry
  namespace: harness-system
spec:
  entryPoints: [harness]
  routes:
    - match: HostSNIRegexp(`^registry\.lab\..+$`)
      services:
        - name: registry
          port: 5000
  tls:
    secretName: wildcard-cert
    options:
      name: registry-http1
---
# Traefik's default TLS options advertise ALPN h2, but this is a TCP route: the bytes go
# to the registry unparsed, and it speaks HTTP/1.1. Offering h2 makes Go clients (crane)
# speak HTTP/2 at an HTTP/1.1 server ("http2: frame too large, … looked like an HTTP/1.1
# header").
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: registry-http1
  namespace: harness-system
spec:
  alpnProtocols: [http/1.1]
