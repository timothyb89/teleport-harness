# TPM joining, exercised against a REAL TPM: a lima VM with an emulated TPM (swtpm) whose
# EK certificate was manufactured by a CA the harness owns. Owning the CA is what makes
# EKCert verification testable at all — without it there is no chain to trust or distrust.
#
# Requires an ENTERPRISE build: lib/join/tpmjoin.CheckTPMRequest refuses TPM joining
# outright on OSS (services.ErrRequiresEnterprise), so run with --ent. Host requirements
# (lima + qemu + swtpm + gnutls) are checked by prebuild.sh, which fails loudly.
#
# The scoped half needs scoped TPM support in the target build. On a build without it the
# scoped token creations fail and the scoped cases report it as such rather than silently
# passing.
name: tpm
description: >
  TPM joining end-to-end against a hardware-shaped TPM. A bot joins from a VM whose vTPM
  holds a CA-issued EK certificate; tokens vary one thing at a time — the trust anchor, the
  ek_public_hash rule, the ek_certificate_serial rule — and the device must be admitted or
  refused accordingly, unscoped and scoped. Also covers admission-time validation: a token
  pinning a certificate serial with no CA to verify it is rejected at create.
provides_feature: tpm_join
requires_features: [tpm]
min_version: v18

preconditions: |
  # the scenario really happened: a TPM join reached auth and was admitted server-side,
  # and tokens are actually being created (so a "denied" is a decision, not a missing token)
  audit_event        bot.join bot_name=tpm-bot method=tpm success=true  # a real TPM join, from auth's own audit log
  observation_equals host unscoped-ekcert-valid token_created true      # tokens are being created, so denials are decisions

claims:
  - id: ekcert-ca-verification
    statement: >
      An EK certificate is accepted only when it chains to a CA configured in
      ekcert_allowed_cas, unscoped and scoped alike.
    why: >
      **One variable.** The valid and invalid twins use the SAME device and the SAME allow
      rule (the device's real `ek_public_hash`); only the trust anchor differs — the CA
      that signed this EKCert, versus an unrelated CA that signed nothing here.

      **So the denial is attributable.** Since the rule matched in both, a refusal can only
      have come from certificate verification, not from allow-rule matching.
    artifacts: [checks.py, prebuild.sh]
    checks: |
      observation_equals host unscoped-ekcert-valid   joined true   # signed by the configured CA -> admitted
      observation_equals host unscoped-ekcert-invalid joined false  # same device, unrelated CA -> refused
      observation_equals host scoped-ekcert-valid     joined true
      observation_equals host scoped-ekcert-invalid   joined false

  - id: ekcert-needs-the-issuer
    statement: >
      Configuring the ROOT of the device's own chain instead of its immediate issuer is
      refused, because verification supplies no intermediates pool.
    why: >
      **A trust anchor that is genuinely in the chain still fails.** The anchor here is the
      root that signed the intermediate that signed this EKCert — so the device is, in the
      ordinary sense, "from this CA".

      **Why it cannot verify.** `lib/tpm/validate.go` verifyEKCert passes `Roots` only, so
      the intermediate is never available to build a path with. Manufacturer EK certs chain
      through intermediates too, which makes this the likely misconfiguration when an admin
      is told to add "the manufacturer CA".
    artifacts: [checks.py]
    checks: |
      observation_equals host unscoped-rootca-invalid joined false  # root-not-issuer anchor -> no path can be built
      observation_equals host scoped-rootca-invalid   joined false

  - id: allow-rule-matching
    statement: >
      Allow rules discriminate on ek_public_hash and on ek_certificate_serial — a device
      whose value differs is refused even though its certificate verified.
    why: >
      **Verification and matching are separate gates.** Every case here configures the
      correct CA, so the EKCert verifies in all four; the only difference is whether the
      pinned value is the device's own.

      **Both matchers are covered.** The hash pair and the serial pair each vary only their
      own field, so neither result can be explained by the other matcher.
    artifacts: [checks.py]
    checks: |
      observation_equals host unscoped-hash-valid     joined true
      observation_equals host unscoped-hash-invalid   joined false  # correct CA, wrong hash -> still refused
      observation_equals host unscoped-serial-valid   joined true
      observation_equals host unscoped-serial-invalid joined false  # correct CA, wrong serial -> still refused
      observation_equals host scoped-hash-valid       joined true
      observation_equals host scoped-hash-invalid     joined false
      observation_equals host scoped-serial-valid     joined true
      observation_equals host scoped-serial-invalid   joined false

  - id: serial-requires-cas
    statement: >
      A token pinning ek_certificate_serial with no ekcert_allowed_cas is rejected at
      admission — including when the rule also pins ek_public_hash.
    why: >
      **Why the rule exists.** With no CA configured the certificate is parsed but never
      verified, so its serial is a value the client chose. Pinning one is a matcher that
      matches whatever the client says.

      **The second case is the discriminating one.** `serial-hash-no-cas` is the ONLY
      configuration the two candidate rules disagree about: "serial requires CAs" rejects
      it, "serial requires hash OR CAs" accepts it. Asserting rejection here is what pins
      the strict rule; if it is ever relaxed, this check — and only this check — flips.
    artifacts: [checks.py]
    checks: |
      observation_equals host unscoped-serial-no-cas      accepted false
      observation_equals host unscoped-serial-hash-no-cas accepted false  # the case the two rules disagree about
      observation_equals host scoped-serial-no-cas        accepted false
      observation_equals host scoped-serial-hash-no-cas   accepted false
