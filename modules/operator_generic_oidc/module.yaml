# operator_generic_oidc: drive the Teleport KUBERNETES OPERATOR (built from the clone,
# running in a disposable in-cluster k3s) to create resources carrying a
# google.protobuf.Struct field, and find out how far the Struct value survives.
#
# ORIGIN. This module was written to find a crdgen bug, and did: crdgen emitted
# `additionalProperties: true` for google.protobuf.Struct (schemagen.go, the
# .google.protobuf.Struct case), which says "any key allowed, values unspecified". A
# value with NO schema has no known sub-fields, so the API server pruned everything one
# level below the Struct — strict clients saw `unknown field
# "…must_match_fields.nested.deep"`, non-strict ones silently stored `nested: {}`. The
# fix is one line: x-kubernetes-preserve-unknown-fields instead, which is what the Labels
# custom type ~80 lines above already used. (The two cannot COEXIST:
# preserve-unknown-fields only stops keys with no schema from being deleted, while a
# non-nil additionalProperties gives every key a route into a nil schema — so pruning
# still descends and empties anything one level down.) The module now GUARDS that fix
# rather than demonstrating the bug.
#
# It is still the operator's answer to the question terraform_generic_oidc asks of the
# Terraform provider, and the answers DIFFER, which is why both exist:
#
#   * Terraform  drops must_match_fields ENTIRELY and silently (the field is excluded
#                from the generated provider schema).
#   * The operator round-trips it correctly, flat AND nested (api/types.Struct carries
#                jsonpb Marshal/UnmarshalJSON, so the CR decodes properly).
#
# Scoped resources need TELEPORT_UNSTABLE_SCOPES=yes on auth (auth_env in render.yaml);
# the operator is left UNSCOPED, which is both the realistic default and what bounds the
# scoped case to a decode — see the `every-struct-site` claim.
name: operator_generic_oidc
description: >
  Teleport Kubernetes operator (built from the clone, running in a disposable k3s) creates
  generic_oidc join tokens (classic + scoped) with must_match_fields and a WorkloadIdentity
  with extra_claims — every google.protobuf.Struct site in the generated CRDs. Flat AND
  nested values must round-trip into Teleport, and both matchers are proven ENFORCED by
  paired negative join tests. The regression guard for the crdgen
  x-kubernetes-preserve-unknown-fields fix.
provides_feature: operator_generic_oidc
requires_features: [generic_oidc]
min_version: v18                 # generic_oidc lands in v18

# Scaffolding: the operator is running and reconciling, and the CRs were actually applied.
# If these fail nothing below was exercised, so the claims read UNTESTED rather than
# DISPROVEN — the distinction matters here because a k3s or rollout failure would otherwise
# produce a wall of FAILs that reads exactly like a broken fix.
preconditions: |
  log_contains         k8s-operator successfully rolled out
  k8s_resource_present teleportprovisiontoken/op-oidc-token
  k8s_condition        teleportprovisiontoken/op-oidc-token SuccessfullyReconciled
  # NON-VACUITY GUARD for the eq-0 assertions in the claims below: if op-crs never ran, its
  # log is empty and every "0 matches" line would pass for the wrong reason. Four
  # manifests, four acceptances.
  log_count            op-crs eq 4 RESULT .*: accepted   # all four CRs reached the API server and were accepted

claims:
  - id: nested-struct-survives-the-crd
    statement: >-
      A NESTED value inside a google.protobuf.Struct survives the generated CRD schema and
      reaches Teleport intact.
    why: |
      The case the crdgen fix restored, checked at **both** layers it could be lost at, and
      against **both** failure modes the old schema produced:

      - **Pruned by the API server.** `additionalProperties: true` gave every key a route
        into a nil schema, so everything one level below the Struct was deleted on write.
        Strict clients got `unknown field`; non-strict ones silently stored `nested: {}`.
        The two eq-0 log counts rule out the loud symptom, the `k8s_resource_field` read
        rules out the silent one.
      - **Dropped by the operator.** Reading the CR back from the API server proves storage
        only. The `resource_field` read against Teleport is what proves the operator's
        unstructured → proto conversion carried the value the rest of the way.

      A check on stored `nested` alone would pass on `nested: {}`, which is the exact
      outcome that made the original bug silent — so both reads name the leaf value.
    artifacts: [config/op-cr-nested.yaml.j2]
    checks: |
      log_count            op-crs eq 0 REJECTED by the API server   # no CR was refused on write
      # The exact symptom the crdgen bug produced under strict field validation (the default).
      log_count            op-crs eq 0 unknown field                # the strict-mode symptom of the pruning bug is absent
      k8s_resource_present teleportprovisiontoken/op-oidc-nested
      k8s_condition        teleportprovisiontoken/op-oidc-nested SuccessfullyReconciled
      k8s_resource_field   teleportprovisiontoken/op-oidc-nested spec.generic_oidc.must_match_fields.nested.deep harness-nested   # stored with its nesting intact, i.e. NOT pruned to `nested: {}`
      resource_field       token/op-oidc-nested spec.generic_oidc.must_match_fields.nested.deep harness-nested                    # and carried into Teleport by the operator

  - id: nested-matching-is-enforced
    statement: >-
      The nested must_match_fields value is EVALUATED at join, not merely stored.
    why: |
      Storage checks alone would call the original bug green, and that is the point of this
      claim: `nested: {}` degrades the matcher to an existence check — a token that still
      exists, still reconciles, and still lets the wrong agent in.

      - **The pair differs in exactly one claim.** Both agents present a JWT satisfying
        `sub` (so `allow_any` is not what separates them) and the flat `org` value. Only the
        nested claim differs, minted via the oidc-server's `?json=` parameter — `?claim=`
        can only produce strings. So the denial is attributable to the nested matcher.
      - **The denial is a gate, not a courtesy.** `node_absent` alone cannot tell "denied by
        the matcher" from "never got as far as asking". Observed for real: curl expanded
        `{...}` in the JWT URL as a brace expansion, the agent was rejected by the IdP with
        an HTTP 400 and never reached Teleport — `node_absent` passed, and only the missing
        denial line exposed it.
    artifacts: [config/op-cr-nested.yaml.j2, config/op-agent-oknested.yaml.j2, config/op-agent-badnested.yaml.j2]
    checks: |
      node_present         op-agent-oknested
      node_absent          op-agent-badnested
      log_count            op-agent-badnested ge 1 unable to (join via|validate) generic_oidc|denied   # denied at the join RPC, so it reached Teleport and was refused

  - id: flat-matching-round-trips
    statement: >-
      A FLAT must_match_fields value round-trips into Teleport and is enforced — the case
      the Terraform provider drops entirely.
    why: |
      Flat values worked even under the broken schema, so this is a guard against a future
      change breaking what already works, and the direct contrast with
      `terraform_generic_oidc`: the provider omits `must_match_fields` from its generated
      schema and drops it silently. If these lines ever fail, the operator has regressed to
      parity with the provider bug.

      Enforcement is proven the same way as the nested case — `op-agent-ok` and
      `op-agent-badorg` differ only in the `org` claim, both satisfying `sub`.
    artifacts: [config/op-cr-flat.yaml.j2, config/op-agent-ok.yaml.j2, config/op-agent-badorg.yaml.j2]
    checks: |
      resource_present     token/op-oidc-token
      resource_field       token/op-oidc-token spec.generic_oidc.must_match_fields.org ethernet-fyi
      node_present         op-agent-ok
      node_absent          op-agent-badorg
      # Softer than the nested case's ge-1 count on purpose: this agent's JWT URL has no
      # braces, so it cannot hit the brace-expansion trap described above.
      log_contains         op-agent-badorg unable to (join via|validate) generic_oidc|denied

  - id: every-struct-site-regenerated
    statement: >-
      Every google.protobuf.Struct site in the generated CRDs carries nested values — not
      just the provision token.
    why: |
      `must_match_fields` exists TWICE in the protos (classic `ProvisionTokenV2` and the
      scoped `ScopedToken`) and `extra_claims` is a third site on `WorkloadIdentity`. crdgen
      emits an INDEPENDENT file per CRD, and `make crd-manifests-diff` only compares what the
      current generator produces against what is checked in — so a partial regeneration is
      invisible to everything except a test that exercises each file.

      - **WorkloadIdentity** is the only site outside `generic_oidc`, so it catches a fix
        narrowed to join tokens. It round-trips fully, like the provision token.
      - **The scoped token stops at the operator's decoder, by design.** Since RFD 328
        (#69074, in master and v18 alike) an operator started without `-scope` refuses to
        reconcile a scoped resource: `reconcilers/generic.go` `checkScope` sets
        `ValidScope=False` and returns *before* the upsert. `ValidStructure=True` is what
        carries the coverage — its message is "Kubernetes CR was successfully decoded", i.e.
        the CR went through the unstructured → proto conversion that crdgen's schema feeds,
        `must_match_fields` and all. Only the write to Teleport is gated.
      - **The gate is asserted, not assumed.** Without the `ValidScope` line, a reconciler
        that stopped running ENTIRELY would look identical to one that ran and refused.
        Expect it to fail the day the operator is given a matching scope — that is the
        signal to restore a round-trip check here, not to relax the line. What that would
        take is written up at the top of `config/op-cr-scoped.yaml.j2`.
    artifacts: [config/op-cr-scoped.yaml.j2, config/op-cr-workload-identity.yaml.j2]
    checks: |
      # ---- the SEPARATE scoped-token CRD, same crdgen code path ----------------------
      k8s_resource_present teleportscopedtokenv1/op-scoped-token
      k8s_resource_field   teleportscopedtokenv1/op-scoped-token spec.generic_oidc.must_match_fields.nested.deep harness-scoped-nested   # the scoped CRD accepts a nested Struct too
      k8s_condition        teleportscopedtokenv1/op-scoped-token ValidStructure                                                          # and the operator decoded it into the ScopedToken proto
      k8s_condition        teleportscopedtokenv1/op-scoped-token ValidScope False                                                        # then declined the write: unscoped operator, scoped resource
      # ---- WorkloadIdentity extra_claims: the third site, outside generic_oidc -------
      k8s_resource_present teleportworkloadidentityv1/op-workload-identity
      k8s_condition        teleportworkloadidentityv1/op-workload-identity SuccessfullyReconciled
      k8s_resource_field   teleportworkloadidentityv1/op-workload-identity spec.spiffe.jwt.extra_claims.nested.deep harness-wi-nested
      resource_field       workload_identity/op-workload-identity spec.spiffe.jwt.extra_claims.team platform
      resource_field       workload_identity/op-workload-identity spec.spiffe.jwt.extra_claims.nested.deep harness-wi-nested
