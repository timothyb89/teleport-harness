# bound_keypair token .status preservation on the UpsertToken RPC path.
#
# Server-side state for a bound_keypair token lives in `.status.bound_keypair` — the bound
# public key, the bound bot instance, the recovery counter. That state is written by the JOIN
# ceremony, not by the admin. The intended rule:
#
#   if the token already exists, `.status` is ALWAYS preserved and any `.status` on an
#   incoming copy is ALWAYS discarded; to change status you must delete and recreate.
#
# Without it, re-applying a local copy of a token (`tctl create -f`, a terraform apply, an
# operator reconcile) wipes the bound key and knocks the bot offline.
#
# KNOWN-FAILING PROBE (the terraform_generic_oidc pattern): against a build without the fix,
# claims 1 and 2 come back DISPROVEN. They flip to PROVEN with no edits to this module.
name: bound_keypair_status
description: >
  bound_keypair token .status is server-owned: re-applying a token (spec-only, or carrying a
  tampered status) preserves the bound key, bound bot instance and recovery counter, while
  legitimate spec edits still land. Delete + recreate remains the only way to set status.
provides_feature: bound_keypair_status
requires_features: [bound_keypair]
min_version: v17

# Scaffolding. If any of these fail the claims below were never exercised, so the report
# marks them UNTESTED rather than reporting failures it cannot attribute.
preconditions: |
  # a real bot really joined via bound_keypair, so status.bound_keypair is server-populated
  # and non-empty — without this every "preserved" assertion below is vacuous.
  bot_joined          bks-bot bound_keypair
  audit_event         bot.join bot_name=bks-bot method=bound_keypair success=true
  output_file         bksbot /out/id/identity
  # the mutator ran to completion; a crashed mutator must not read as a pass.
  log_count           bkstatus ge 1 RESULT mutator: DONE

claims:
  - id: preserved-on-update
    statement: If the token already exists, .status is preserved across any update.
    why: >
      The bot bound a key during onboarding, so `status.bound_keypair` holds a real public
      key, bot instance and recovery counter before anything is applied (see Preconditions).
      The mutator then applies two updates that a real admin tool would send — one carrying
      NO status at all (the `tctl get | apply`, terraform and operator roundtrip), and one
      carrying a fully forged status — and after each, re-reads the token and compares every
      status field against the values captured beforehand.
      Both applies were ACCEPTED: each carries a distinct `recovery.limit` sentinel and the
      mutator blocks until that sentinel is readable before comparing, which proves the write
      landed AND defeats a stale cached read (`tctl get` resolves through the auth cache, so
      an immediate read can return the pre-write token — a run once passed for exactly that
      reason). So this is preservation through a SUCCESSFUL update, not an update that was
      rejected or silently dropped.
      The two `resource_field_not` checks name the forged sentinels rather than merely
      asserting the fields are present, because the tampered apply SUPPLIES values: a bare
      presence check passes on the worst outcome, since a forgery is still a value.
    checks: |
      log_count           bkstatus ge 1 RESULT spec-only-reapply-preserves-status: PASS
      log_count           bkstatus ge 1 RESULT tampered-status-discarded: PASS
      resource_field_not  token/bks-token status.bound_keypair.bound_public_key HarnessTamperedKey
      resource_field_not  token/bks-token status.bound_keypair.bound_bot_instance_id 00000000-0000-0000-0000-000000000000
      resource_field      token/bks-token status.bound_keypair.recovery_count 1
      log_count           bkstatus ge 1 RESULT upsert-discards-status: PASS

  - id: status-honored-on-create
    statement: If the token does NOT already exist, .status on the incoming copy is honored.
    why: >
      This is the other half of the rule, and the reason the rule is usable at all: delete +
      recreate is the sanctioned way to change status, and backup/restore depends on a create
      accepting the status it is given.
      Proved on a spare token nothing ever joins with, so the live bot's token is undisturbed.
      The mutator creates it carrying status marker A and confirms A landed; the identical
      marker-B file is then applied twice — once as an UPDATE, where it must be discarded, and
      once after a DELETE, where it must be accepted. One file, two opposite outcomes, the
      only difference being whether the token already existed. That contrast is what
      distinguishes "status is honored on create" from "status is honored always".
    checks: |
      log_count           bkstatus ge 1 RESULT create-accepts-status: PASS
      log_count           bkstatus ge 1 RESULT recreate-sets-status: PASS
      resource_field      token/bks-recreate status.bound_keypair.registration_secret harness-bks-marker-b
      resource_field      token/bks-recreate spec.bound_keypair.recovery.limit 5

  - id: updates-still-work
    statement: Preserving status does not block legitimate spec edits, and the bot stays usable.
    why: >
      Guards the over-correction. "Never touch status" must not degrade into "ignore the
      update", and preserving status is worthless if the bot it belongs to is broken anyway.
      The spec check is the mutator's own barrier: it polls until the new `recovery.limit` is
      readable, so the edit is observed to have landed at the moment it happened.
      It is deliberately NOT asserted against the live token at verify time — `bks-token`
      comes from `bootstrap/`, and the shared auth-entrypoint re-applies every module's
      bootstrap YAML on every auth start, so a sibling module that restarts auth legitimately
      restores the original limit. Observed live: 9 restarts, 9 re-applies, spec back to its
      bootstrap value while status survived all of them.
      The identity check closes the loop behaviourally: a status wipe would leave the bot
      unable to re-join, so an identity that still authenticates is end-to-end evidence that
      preservation worked.
    checks: |
      log_count           bkstatus ge 1 RESULT spec-edit-applied: PASS
      identity_authorized bksbot /out/id/identity
