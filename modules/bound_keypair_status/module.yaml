# bound_keypair token .status preservation on the UpsertToken RPC path.
#
# Server-side state for a bound_keypair token lives in `.status.bound_keypair` — the bound
# public key, the bound bot instance, the recovery counter. That state is written by the JOIN
# ceremony, not by the admin. The intended rule:
#
#   if the token already exists, `.status` is ALWAYS preserved and any `.status` on an
#   incoming copy is ALWAYS discarded; to change status you must delete and recreate.
#
# Without it, re-applying a local copy of a token (`tctl create -f`, a terraform apply, an
# operator reconcile) wipes the bound key and knocks the bot offline.
#
# KNOWN-FAILING PROBE (the terraform_generic_oidc pattern): against a build without the fix,
# claims 1 and 2 come back DISPROVEN. They flip to PROVEN with no edits to this module.
name: bound_keypair_status
description: >
  bound_keypair token .status is server-owned: re-applying a token (spec-only, or carrying a
  tampered status) preserves the bound key, bound bot instance and recovery counter, while
  legitimate spec edits still land. Delete + recreate remains the only way to set status.
provides_feature: bound_keypair_status
requires_features: [bound_keypair]
min_version: v17

# Scaffolding. If any of these fail the claims below were never exercised, so the report
# marks them UNTESTED rather than reporting failures it cannot attribute.
preconditions: |
  bot_joined          bks-bot bound_keypair          # a real bot joined, so status is server-populated
  audit_event         bot.join bot_name=bks-bot method=bound_keypair success=true
  output_file         bksbot /out/id/identity
  output_file         bkstatus /out/observations.json      # the actor ran and recorded what it saw

claims:
  - id: preserved-on-update
    statement: If the token already exists, .status is preserved across any update.
    why: |
      `mutate.sh` applies two updates a real admin tool would send, recording every status
      field before and after each — the `observation_*` checks below do the comparing, so the
      proof is the recorded values themselves:

      - **spec-only** — no `status` at all: the `tctl get | apply`, terraform and operator roundtrip.
      - **tampered** — a fully forged `status`: a key the bot does not hold, a nil-UUID instance,
        `recovery_count: 99`, an unissued secret.

      Three things make the comparison meaningful:

      - **The applies were accepted.** Each carries a distinct `recovery.limit` sentinel and the
        `after` snapshot is taken only once that sentinel is readable, so this is preservation
        through a *successful* update — not one rejected or dropped. `observation_equals` on the
        tampered case asserts that sentinel rather than taking the barrier on trust.
      - **A stale read cannot fake it.** `tctl get` goes through the auth cache, so a read taken
        straight after an apply can return the pre-write token; a run once passed for exactly
        that reason. The sentinel wait is what rules it out.
      - **The live checks name the forged values.** A bare presence check passes on the worst
        outcome here, because the tampered apply *supplies* values and a forgery is still a value.
    artifacts: [scripts/mutate.sh, config/token-spec-only.yaml.j2, config/token-tampered.yaml.j2]
    checks: |
      observation_unchanged bkstatus spec-only-reapply status.bound_keypair.bound_public_key status.bound_keypair.bound_bot_instance_id status.bound_keypair.recovery_count status.bound_keypair.registration_secret
      observation_unchanged bkstatus tampered-reapply status.bound_keypair.bound_public_key status.bound_keypair.bound_bot_instance_id status.bound_keypair.recovery_count status.bound_keypair.registration_secret
      observation_equals    bkstatus tampered-reapply spec.bound_keypair.recovery.limit 9
      observation_unchanged bkstatus update-with-status status.bound_keypair.registration_secret
      resource_field_not    token/bks-token status.bound_keypair.bound_public_key HarnessTamperedKey
      resource_field_not    token/bks-token status.bound_keypair.bound_bot_instance_id 00000000-0000-0000-0000-000000000000
      resource_field        token/bks-token status.bound_keypair.recovery_count 1

  - id: status-honored-on-create
    statement: If the token does NOT already exist, .status on the incoming copy is honored.
    why: |
      The other half of the rule, and what makes it usable: delete + recreate is the sanctioned
      way to change status, and backup/restore depends on create accepting what it is given.

      Proved on a spare token nothing joins with, so the live bot is undisturbed. The *same*
      marker-B file is applied twice, and must be:

      - **discarded** when applied over the existing marker-A token, and
      - **accepted** when applied after deleting it.

      One file, two opposite outcomes, differing only in whether the token already existed —
      which is what separates "honored on create" from "honored always".
    artifacts: [scripts/mutate.sh, config/spare-marker-a.yaml.j2, config/spare-marker-b.yaml.j2]
    checks: |
      observation_equals bkstatus create-with-status status.bound_keypair.registration_secret harness-bks-marker-a
      observation_equals bkstatus recreate-with-status status.bound_keypair.registration_secret harness-bks-marker-b
      resource_field     token/bks-recreate status.bound_keypair.registration_secret harness-bks-marker-b   # live spare token ended up with the recreated status
      resource_field     token/bks-recreate spec.bound_keypair.recovery.limit 5                             # ...and its spec, confirming the whole resource round-tripped

  - id: updates-still-work
    statement: Preserving status does not block legitimate spec edits, and the bot stays usable.
    why: |
      Guards the over-correction: "never touch status" must not become "ignore the update", and
      preserving status is worthless if the bot it belongs to is broken.

      - The spec check is the mutator's own barrier — it polls until the new `recovery.limit`
        is readable, so the edit is observed landing at the moment it happens.
      - It is deliberately *not* re-asserted at verify time. `bks-token` comes from
        `bootstrap/`, which the shared auth-entrypoint re-applies on every auth start, so a
        sibling module that restarts auth legitimately restores the original limit. Observed
        live: 9 restarts, 9 re-applies, spec back to its bootstrap value — status survived all.
      - The identity check closes the loop behaviourally: a status wipe leaves the bot unable
        to re-join, so an identity that still authenticates is end-to-end evidence.
    artifacts: [scripts/mutate.sh, bootstrap/token.yaml.j2]
    checks: |
      observation_equals  bkstatus spec-only-reapply spec.bound_keypair.recovery.limit 7
      identity_authorized bksbot /out/id/identity                        # the bot's identity still authenticates after both re-applies
